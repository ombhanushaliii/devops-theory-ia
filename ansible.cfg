[defaults]
inventory = /workspace/inventory/hosts.ini
remote_user = ansible
private_key_file = /run/ssh/id_ed25519
host_key_checking = False
retry_files_enabled = False
interpreter_python = /usr/bin/python3
forks = 3

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
